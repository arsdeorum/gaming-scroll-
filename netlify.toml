[build]
  publish = "."
  command = "node build.mjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Daily is the home page, the terminal is at /terminal/. The files stay where
# they are (index.html = terminal, daily/index.html = Daily); only the URLs move.
[[redirects]]
  from = "/"
  to = "/daily/index.html"
  status = 200
  force = true
# Spanish edition: build.mjs writes Spanish-only copies of the two pages.
[[redirects]]
  from = "/es/terminal"
  to = "/index.es.html"
  status = 200
  force = true
[[redirects]]
  from = "/es"
  to = "/daily/index.es.html"
  status = 200
  force = true
# Russian edition: same two pages. The RU button links to ?lang=ru; these rules
# also make /ru/ and /ru/terminal/ work, and the page script reads /ru from the URL.
[[redirects]]
  from = "/ru/terminal"
  to = "/index.ru.html"
  status = 200
  force = true
[[redirects]]
  from = "/ru"
  to = "/daily/index.ru.html"
  status = 200
  force = true
# Netlify treats /terminal and /terminal/ as the same path, so one rule covers both.
[[redirects]]
  from = "/terminal"
  to = "/index.html"
  status = 200
  force = true

# The repo root is the publish folder. Hide everything that is not a page.
[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/data/chunks.json"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

# Keep the private stats page out of search engines
[[headers]]
  for = "/stats/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Installable app: the service worker must always be checked for updates
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/manifest-*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"
# Small scripts without a hash in the name: cache for an hour, then check for a newer copy.
[[headers]]
  for = "/install.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Story data files: the name carries a content hash, so a changed file gets a new URL.
# Unchanged files stay in the reader's cache; only new or changed ones are downloaded.
[[headers]]
  for = "/data/*"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"
