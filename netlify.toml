[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The repo root is the publish folder. Hide everything that is not a page.
[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

# Keep the private stats page out of search engines
[[headers]]
  for = "/stats/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Installable app: the service worker must always be checked for updates
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
